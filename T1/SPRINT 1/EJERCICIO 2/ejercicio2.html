<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Calculadora de Área</title>
</head>
<body>
    <h1>Calculadora de Área de un Rectángulo</h1>

    <form id="areaForm">
        <div>
            <label for="ancho">Ancho:</label>
            <input type="number" id="ancho" name="ancho" step="any" required placeholder="Introduce el ancho">
        </div>
        <br>
        <div>
            <label for="alto">Alto:</label>
            <input type="number" id="alto" name="alto" step="any" required placeholder="Introduce el alto">
        </div>
        <br>
        <button type="button" id="btnCalcular">Calcular Área</button>
    </form>

    <p id="resultado"></p>

    <script src="ejercicio2.js"></script>
</body>
</html>
