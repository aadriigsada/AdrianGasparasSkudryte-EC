<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Hover y Estilo Dinámico</title>
    <style>
        .caja {
            padding: 20px;
            margin: 10px 0;
            background-color: #f0f0f0;
            color: #333333;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
    </style>
</head>
<body>
    <h1>Cambio de Estilo Dinámico (Hover)</h1>
    <p>Pasa el ratón por encima de los siguientes bloques:</p>

    <div class="caja">Elemento 1: Primer bloque de texto</div>
    <div class="caja">Elemento 2: Segundo bloque de texto</div>
    <div class="caja">Elemento 3: Tercer bloque de texto</div>
    <div class="caja">Elemento 4: Cuarto bloque de texto</div>

    <script src="ejercicio4.js"></script>
</body>
</html>
