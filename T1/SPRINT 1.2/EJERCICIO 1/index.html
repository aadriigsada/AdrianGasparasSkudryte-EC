<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Temporizador</title>
  <style>
    /* Estilo del overlay del susto */
    #scareOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 9999;
    }

    #scareOverlay img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Alerta flotante (toast / badge) sobre la imagen */
    .floating-alert {
      display: none;
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(220, 38, 38, 0.9);
      color: white;
      padding: 16px 28px;
      border-radius: 50px;
      font-size: 1.4rem;
      font-weight: bold;
      font-family: Arial, sans-serif;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 2px solid #ffffff;
      z-index: 10000;
      text-align: center;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>Temporizador</h1>

  <label for="secondsInput">Segundos:</label>
  <input type="number" id="secondsInput" min="1">
  <button id="startBtn">Iniciar</button>

  <p>Tiempo restante: <span id="timeDisplay">0</span>s</p>
  <p id="messageDisplay"></p>

  <!-- Alerta flotante -->
  <div id="floatingAlert" class="floating-alert">
    ¡Tiempo finalizado! 😱
  </div>

  <!-- Imagen de susto -->
  <div id="scareOverlay">
    <img src="https://imgs.search.brave.com/o8mDzToxIKIy8vaGrOAM5wScrJ4BiGLQJoMVNntYJeQ/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9tLm1l/ZGlhLWFtYXpvbi5j/b20vaW1hZ2VzL00v/TVY1Qk1tRTBOMlE0/WVRJdE0yWXhNQzAw/TW1FeUxUbGhNVFl0/TW1VME5HRm1PREU1/WkRnNVhrRXlYa0Zx/Y0djQC5qcGc" alt="Susto">
  </div>

  <script src="script.js"></script>
</body>
</html>
