<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - PokeAPI</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        h1, h2 { color: #2c3e50; margin-bottom: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .section { background: white; padding: 20px; margin-bottom: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 200px; }
        button { background-color: #e74c3c; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #c0392b; }
        button.btn-secundario { background-color: #3498db; }
        button.btn-secundario:hover { background-color: #2980b9; }
        
        .card-pokemon { display: flex; align-items: center; gap: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .card-pokemon img { width: 120px; height: 120px; }
        .badge { display: inline-block; background: #ee5253; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.85em; margin-right: 5px; text-transform: capitalize; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
        .winner { background-color: #d4edda; font-weight: bold; }
        
        .evolution-chain { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
        .evo-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; width: 220px; text-align: center; }
        .evo-card img { width: 90px; height: 90px; }
        
        .error-msg { color: #d9534f; background: #fdf7f7; padding: 10px; border-radius: 6px; border: 1px solid #d9534f; margin-top: 10px; }
        
        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; max-width: 500px; width: 90%; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h1>Boletín Sprint 3 - Ejercicio 2: PokeAPI</h1>

    <!-- Parte 1 -->
    <div class="section">
        <h2>Parte 1: Información Básica del Pokémon</h2>
        <div class="form-group">
            <input type="text" id="p1-input" placeholder="Nombre o ID del Pokémon (ej: pikachu, 25)">
            <button onclick="ejecutarParte1()">Buscar</button>
            <button class="btn-secundario" onclick="probarErrorP1()">Probar Error ("fakepokemon")</button>
        </div>
        <div id="p1-resultado"></div>
    </div>

    <!-- Parte 2 -->
    <div class="section">
        <h2>Parte 2: Comparativa de Pokémon</h2>
        <div class="form-group">
            <input type="text" id="p2-input1" placeholder="Pokémon 1 (ej: bulbasaur)">
            <input type="text" id="p2-input2" placeholder="Pokémon 2 (ej: squirtle)">
            <button onclick="ejecutarParte2()">Comparar</button>
        </div>
        <div id="p2-resultado"></div>
    </div>

    <!-- Parte 3 -->
    <div class="section">
        <h2>Parte 3: Evoluciones y Habilidades</h2>
        <div class="form-group">
            <input type="text" id="p3-input" placeholder="Nombre del Pokémon (ej: charmander, tauros)">
            <button onclick="ejecutarParte3()">Obtener Cadena Evolutiva</button>
        </div>
        <div id="p3-resultado"></div>
    </div>
</div>

<!-- Modal para Detalles de Habilidad -->
<div id="modalHabilidad" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="cerrarModal()">&times;</span>
        <h3 id="modal-titulo" style="text-transform: capitalize;"></h3>
        <p id="modal-descripcion">Cargando detalles...</p>
    </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
