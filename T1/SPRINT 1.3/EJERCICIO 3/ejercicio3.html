<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Gestión de Miembros de la Guild</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        h1 { color: #2c3e50; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Acciones y Botones */
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        button { border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-primary { background-color: #27ae60; color: white; }
        .btn-primary:hover { background-color: #219150; }
        .btn-edit { background-color: #f39c12; color: white; padding: 6px 12px; margin-right: 5px; }
        .btn-edit:hover { background-color: #d68910; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 6px 12px; }
        .btn-delete:hover { background-color: #c0392b; }
        .btn-secondary { background-color: #95a5a6; color: white; }
        .btn-secondary:hover { background-color: #7f8c8d; }

        /* Tabla */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { border-bottom: 1px solid #eee; padding: 12px 15px; text-align: left; }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f8f9fa; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; overflow-y: auto; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; max-width: 650px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .close-btn { font-size: 24px; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #000; }

        /* Formulario Grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        label { font-size: 0.9em; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .checkbox-group input { width: auto; }

        .error-banner { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <h1>Gestión de Miembros de la Guild</h1>
        <button class="btn-primary" onclick="abrirModalCrear()">+ Add New Member</button>
    </div>

    <!-- Tabla de Miembros -->
    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Level</th>
                <th>Item Level</th>
                <th>Character Role</th>
                <th>Guild Role</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-miembros">
            <tr><td colspan="7" style="text-align: center;">Cargando miembros...</td></tr>
        </tbody>
    </table>
</div>

<!-- Modal Unificado Add / Edit Member -->
<div id="modalMiembro" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-titulo">Add New Member</h3>
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
        </div>

        <div id="error-banner" class="error-banner"></div>

        <form id="form-miembro" onsubmit="guardarMiembro(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="user_id">User ID *</label>
                    <input type="text" id="user_id" required>
                </div>
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="level">Level *</label>
                    <input type="number" id="level" min="1" required>
                </div>
                <div class="form-group">
                    <label for="ilvl">Item Level (ilvl) *</label>
                    <input type="number" id="ilvl" min="1" required>
                </div>
                <div class="form-group">
                    <label for="character_role">Character Role *</label>
                    <select id="character_role" required>
                        <option value="TANK">TANK</option>
                        <option value="HEALER">HEALER</option>
                        <option value="DAMAGE">DAMAGE</option>
                        <option value="SUPPORT">SUPPORT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="guild_role">Guild Role *</label>
                    <select id="guild_role" required>
                        <option value="LIDER">LIDER</option>
                        <option value="GERENTE SENIOR">GERENTE SENIOR</option>
                        <option value="GERENTE">GERENTE</option>
                        <option value="GERENTE A2">GERENTE A2</option>
                        <option value="ALPHA 2">ALPHA 2</option>
                        <option value="MEMBER">MEMBER</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="main_archetype">Main Archetype *</label>
                    <select id="main_archetype" required>
                        <option value="BARD">BARD</option>
                        <option value="CLERIC">CLERIC</option>
                        <option value="FIGHTER">FIGHTER</option>
                        <option value="MAGE">MAGE</option>
                        <option value="RANGER">RANGER</option>
                        <option value="ROGUE">ROGUE</option>
                        <option value="SUMMONER">SUMMONER</option>
                        <option value="TANK">TANK</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="secondary_archetype">Secondary Archetype *</label>
                    <select id="secondary_archetype" required>
                        <option value="BARD">BARD</option>
                        <option value="CLERIC">CLERIC</option>
                        <option value="FIGHTER">FIGHTER</option>
                        <option value="MAGE">MAGE</option>
                        <option value="RANGER">RANGER</option>
                        <option value="ROGUE">ROGUE</option>
                        <option value="SUMMONER">SUMMONER</option>
                        <option value="TANK">TANK</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="grandmaster_profession_one">Grandmaster Profession 1 *</label>
                    <select id="grandmaster_profession_one" required>
                        <option value="FISHING">FISHING</option>
                        <option value="HERBALISM">HERBALISM</option>
                        <option value="HUNTING">HUNTING</option>
                        <option value="LUMBERJACKING">LUMBERJACKING</option>
                        <option value="MINING">MINING</option>
                        <option value="ALCHEMY">ALCHEMY</option>
                        <option value="ANIMALHUSBANDRY">ANIMALHUSBANDRY</option>
                        <option value="COOKING">COOKING</option>
                        <option value="FARMING">FARMING</option>
                        <option value="LUMBERMILLING">LUMBERMILLING</option>
                        <option value="METALWORKING">METALWORKING</option>
                        <option value="STONECUTTING">STONECUTTING</option>
                        <option value="TANNING">TANNING</option>
                        <option value="WEAVING">WEAVING</option>
                        <option value="ARCANEENGINEERING">ARCANEENGINEERING</option>
                        <option value="ARMORSMITHING">ARMORSMITHING</option>
                        <option value="CARPENTRY">CARPENTRY</option>
                        <option value="JEWELCUTTING">JEWELCUTTING</option>
                        <option value="LEATHERWORKING">LEATHERWORKING</option>
                        <option value="SCRIBE">SCRIBE</option>
                        <option value="TAILORING">TAILORING</option>
                        <option value="WEAPONSMITHING">WEAPONSMITHING</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="grandmaster_profession_two">Grandmaster Profession 2 *</label>
                    <select id="grandmaster_profession_two" required>
                        <option value="FISHING">FISHING</option>
                        <option value="HERBALISM">HERBALISM</option>
                        <option value="HUNTING">HUNTING</option>
                        <option value="LUMBERJACKING">LUMBERJACKING</option>
                        <option value="MINING">MINING</option>
                        <option value="ALCHEMY">ALCHEMY</option>
                        <option value="ANIMALHUSBANDRY">ANIMALHUSBANDRY</option>
                        <option value="COOKING">COOKING</option>
                        <option value="FARMING">FARMING</option>
                        <option value="LUMBERMILLING">LUMBERMILLING</option>
                        <option value="METALWORKING">METALWORKING</option>
                        <option value="STONECUTTING">STONECUTTING</option>
                        <option value="TANNING">TANNING</option>
                        <option value="WEAVING">WEAVING</option>
                        <option value="ARCANEENGINEERING">ARCANEENGINEERING</option>
                        <option value="ARMORSMITHING">ARMORSMITHING</option>
                        <option value="CARPENTRY">CARPENTRY</option>
                        <option value="JEWELCUTTING">JEWELCUTTING</option>
                        <option value="LEATHERWORKING">LEATHERWORKING</option>
                        <option value="SCRIBE">SCRIBE</option>
                        <option value="TAILORING">TAILORING</option>
                        <option value="WEAPONSMITHING">WEAPONSMITHING</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="ejemplo@guild.com" required>
                </div>
                <div class="form-group full-width checkbox-group">
                    <input type="checkbox" id="notify_email" checked>
                    <label for="notify_email" style="margin: 0;">Recibir notificaciones por correo electrónico</label>
                </div>
            </div>

            <div style="margin-top: 20px; text-align: right;">
                <button type="button" class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button type="submit" class="btn-primary" id="btn-guardar">Guardar Miembro</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
