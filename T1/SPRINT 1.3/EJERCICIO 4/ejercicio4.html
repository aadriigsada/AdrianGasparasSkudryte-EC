<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Creación de Party</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        h1 { color: #2c3e50; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        button { border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-primary { background-color: #8e44ad; color: white; }
        .btn-primary:hover { background-color: #732d91; }
        .btn-secondary { background-color: #95a5a6; color: white; }
        .btn-secondary:hover { background-color: #7f8c8d; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { border-bottom: 1px solid #eee; padding: 12px 15px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f8f9fa; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; max-width: 500px; width: 100%; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .close-btn { font-size: 24px; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #000; }

        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-size: 0.9em; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em; }

        .error-banner { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
        .success-banner { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <h1>Party Finder - Listado de Parties</h1>
        <button class="btn-primary" onclick="abrirModal()">+ Create New Party</button>
    </div>

    <div id="main-success-banner" class="success-banner"></div>

    <table>
        <thead>
            <tr>
                <th>Party ID</th>
                <th>Size</th>
                <th>Creator ID</th>
                <th>Planned Start</th>
                <th>Level Cap</th>
                <th>iLvl Cap</th>
                <th>Creator Role</th>
            </tr>
        </thead>
        <tbody id="tabla-parties">
            <!-- Las parties creadas en esta sesión se listarán aquí -->
        </tbody>
    </table>
</div>

<!-- Modal para Crear Party -->
<div id="modalParty" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Create a Party</h3>
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
        </div>

        <div id="error-banner" class="error-banner"></div>

        <form id="form-party" onsubmit="crearParty(event)">
            <div class="form-group">
                <label for="party_size">Party Size *</label>
                <select id="party_size" required>
                    <option value="" disabled selected>Selecciona tamaño</option>
                    <option value="3">3 Miembros</option>
                    <option value="5">5 Miembros</option>
                    <option value="8">8 Miembros</option>
                </select>
            </div>
            <div class="form-group">
                <label for="creator_id">Creator ID *</label>
                <input type="text" id="creator_id" placeholder="ID del miembro (ej. dfas)" required>
            </div>
            <div class="form-group">
                <label for="level_cap">Level Cap *</label>
                <input type="number" id="level_cap" min="1" placeholder="Nivel mínimo" required>
            </div>
            <div class="form-group">
                <label for="ilvl_cap">Item Level Cap (ilvl) *</label>
                <input type="number" id="ilvl_cap" min="1" placeholder="Nivel de ítem mínimo" required>
            </div>
            <div class="form-group">
                <label for="party_role">Creator Party Role *</label>
                <select id="party_role" required>
                    <option value="TANK">TANK</option>
                    <option value="HEALER">HEALER</option>
                    <option value="DAMAGE">DAMAGE</option>
                    <option value="SUPPORT">SUPPORT</option>
                </select>
            </div>
            <div class="form-group">
                <label for="planned_start">Planned Start *</label>
                <input type="text" id="planned_start" placeholder="DD/MM/YYYY_HH:mm" required>
                <small style="color: #666; margin-top: 4px;">Formato estricto: DD/MM/YYYY_HH:mm (ej. 25/12/2026_18:30)</small>
            </div>

            <div style="margin-top: 20px; text-align: right;">
                <button type="button" class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button type="submit" class="btn-primary">Create Party</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
